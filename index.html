<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Пшикание волос" />
  <title>Пшикание волос</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #111;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    .app {
      width: 100%;
      max-width: 430px;
    }

    .header { margin-bottom: 22px; }

    .date {
      color: #777;
      font-size: 14px;
      margin-bottom: 5px;
    }

    h1 {
      font-size: 30px;
      line-height: 1.1;
      margin: 0;
      letter-spacing: -0.8px;
    }

    .today {
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }

    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .progress-title {
      font-size: 16px;
      font-weight: 600;
    }

    .counter {
      font-size: 14px;
      color: #777;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 17px;
      padding: 16px 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
      background: #f0f0f2;
      color: #111;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(0.97); }

    button.done {
      background: #111;
      color: white;
    }

    .icon {
      display: block;
      font-size: 23px;
      margin-bottom: 7px;
    }

    .history-title {
      font-size: 18px;
      font-weight: 700;
      margin: 24px 4px 10px;
    }

    .history {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .day {
      background: white;
      border-radius: 17px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .day-date {
      font-size: 14px;
      font-weight: 600;
    }

    .marks {
      display: flex;
      gap: 6px;
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #eeeef0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .mark.done {
      background: #111;
      color: white;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }

    .reset {
      width: 100%;
      margin-top: 18px;
      background: transparent;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">
      <div class="date" id="currentDate"></div>
      <h1>Пшикание волос</h1>
    </div>

    <div class="today">
      <div class="progress">
        <div class="progress-title">Сегодня</div>
        <div class="counter" id="counter">0 из 2</div>
      </div>

      <div class="buttons">
        <button id="morningBtn" onclick="toggleDose('morning')">
          <span class="icon">☀️</span>
          Утро
        </button>

        <button id="eveningBtn" onclick="toggleDose('evening')">
          <span class="icon">🌙</span>
          Вечер
        </button>
      </div>
    </div>

    <div class="history-title">История</div>
    <div class="history" id="history"></div>

    <button class="reset" onclick="resetAll()">
      Сбросить историю
    </button>

  </div>

<script>
  const STORAGE_KEY = "hair_spray_tracker";

  function getData() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
    } catch (error) {
      return {};
    }
  }

  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function getToday() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function formatDate(dateString) {
    const date = new Date(dateString + "T00:00:00");

    return date.toLocaleDateString("ru-RU", {
      day: "numeric",
      month: "long"
    });
  }

  function toggleDose(type) {
    const data = getData();
    const today = getToday();

    if (!data[today]) {
      data[today] = {
        morning: false,
        evening: false
      };
    }

    data[today][type] = !data[today][type];

    saveData(data);
    render();
  }

  function render() {
    const data = getData();
    const today = getToday();

    if (!data[today]) {
      data[today] = {
        morning: false,
        evening: false
      };
    }

    const morning = data[today].morning;
    const evening = data[today].evening;

    document.getElementById("morningBtn")
      .classList.toggle("done", morning);

    document.getElementById("eveningBtn")
      .classList.toggle("done", evening);

    const count =
      (morning ? 1 : 0) +
      (evening ? 1 : 0);

    document.getElementById("counter").textContent =
      `${count} из 2`;

    document.getElementById("currentDate").textContent =
      new Date().toLocaleDateString("ru-RU", {
        weekday: "long",
        day: "numeric",
        month: "long"
      });

    renderHistory(data);
  }

  function renderHistory(data) {
    const history = document.getElementById("history");

    const dates = Object.keys(data)
      .sort()
      .reverse();

    if (dates.length === 0) {
      history.innerHTML =
        '<div class="empty">Здесь появится история отметок</div>';
      return;
    }

    history.innerHTML = dates
      .slice(0, 30)
      .map(date => {
        const day = data[date];

        return `
          <div class="day">
            <div class="day-date">
              ${formatDate(date)}
            </div>

            <div class="marks">
              <div class="mark ${day.morning ? "done" : ""}">
                ${day.morning ? "✓" : "☀️"}
              </div>

              <div class="mark ${day.evening ? "done" : ""}">
                ${day.evening ? "✓" : "🌙"}
              </div>
            </div>
          </div>
        `;
      })
      .join("");
  }

  function resetAll() {
    if (confirm("Удалить всю историю отметок?")) {
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  }

  render();
</script>

</body>
</html>
